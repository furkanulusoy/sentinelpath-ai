[project]
name = "sentinelpath-ai"
version = "0.1.0"
description = "Predict the attack before it happens — an AI-assisted attack path prediction engine grounded in MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SentinelPath AI Contributors" }]

# --- Bagimlilik gerekcesi ---
# Bu Faz 1'de dependency GRUPLARI tanimlanir; her fazda o faza ozel
# kutuphaneler ilgili gruba eklenecektir. Hepsini bastan "core" grubuna
# koymak yerine ayirmamizin nedeni: bir katkida bulunan sadece API
# gelistirmek istiyorsa `pip install .[api]` yeterli olsun, ML
# kutuphanelerini (torch gibi agir bagimliliklar) indirmek zorunda kalmasin.
dependencies = [
    "networkx>=3.2",       # Graph Builder + Attack Path Engine (Faz 4, 6)
    "pandas>=2.2",         # Feature Extraction (Faz 3)
    "numpy>=1.26",         # Feature Extraction, Prediction (Faz 3, 6)
    "pydantic>=2.6",       # Domain veri dogrulama / API sozlesmeleri
    "pydantic-settings>=2.2",  # Tip-guvenli config yonetimi
    "structlog>=24.1",     # Yapilandirilmis (JSON) loglama
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
network = [
    "scapy>=2.5",          # Faz 2: pasif ag kesfi (opsiyonel, root/izin gerektirir)
]
ml = [
    "scikit-learn>=1.4",   # Faz 6: Isolation Forest, Random Forest baseline modeller
    "xgboost>=2.0",        # Faz 6: model karsilastirmasi
]
gnn = [
    "torch>=2.2",          # Faz 6+: Graph Neural Network / Temporal Graph Network
    # NOT: Bu grup bilerek 'ml' grubundan AYRI. Gerekce ARCHITECTURE.md'de:
    # GNN, MVP baseline modelinden cok daha agir bir bagimlilik ve veri
    # gereksinimine sahiptir; erken asamada zorunlu kilmak katki
    # bariyerini gereksiz yukseltir.
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",            # linting + formatting (tek arac, Black+isort+flake8 yerine)
    "mypy>=1.9",             # statik tip kontrolu (Protocol tabanli mimari icin ozellikle degerli)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelpath"]
# Faz 10 notu: static/dashboard artik paketin ICINDE (src/sentinelpath/static/)
# -- bu, hatchling'in varsayilan davranisiyla wheel'e dahil edilmesi
# beklenir (paket dizini altindaki tum dosyalar). BU DAVRANIS, bu
# sandbox'ta hatchling kurulu olmadigi icin GERCEK bir build ile
# DOGRULANAMADI (bkz. ADR 0012). Docker imaji buna bagimli DEGILDIR --
# static dosyalar Dockerfile'da ACIKCA kopyalanir (bkz. Dockerfile,
# SENTINELPATH_STATIC_DIR). CI'da `python -m build` ile bu varsayimin
# dogrulanmasi onerilir.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
# Protocol tabanli port'larda yapisal tip uyusmazliklarini erken yakalamak
# icin mypy'nin katkisi buyuk -- bu mimaride "unittest'te gecti ama
# adapter aslinda portu tam karsilamiyordu" hatasini derleme zamaninda
# (type-check zamaninda) yakalariz.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
