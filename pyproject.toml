[project]
name = "sentinelpath-ai"
version = "0.1.0"
description = "Predict the attack before it happens — an AI-assisted attack path prediction engine grounded in MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Furkan Ulusoy" }]

# Opsiyonel gruplar (bkz. ARCHITECTURE.md) icin asagiya bakin.

dependencies = [
    "networkx>=3.2",       # Graph Builder + Attack Path Engine (Faz 4, 6)
    "pandas>=2.2",         # Feature Extraction (Faz 3)
    "numpy>=1.26",         # Feature Extraction, Prediction (Faz 3, 6)
    "pydantic>=2.6",       # Domain veri dogrulama / API sozlesmeleri
    "pydantic-settings>=2.2",  # Tip-guvenli config yonetimi
    "structlog>=24.1",     # Yapilandirilmis (JSON) loglama
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
network = [
    "scapy>=2.5",          # Faz 2: pasif ag kesfi (opsiyonel, root/izin gerektirir)
]
ml = [
    "scikit-learn>=1.4",   # Faz 6: Isolation Forest, Random Forest baseline modeller
    "xgboost>=2.0",        # Faz 6: model karsilastirmasi
]
gnn = [
    "torch>=2.2",          # bkz. ADR 0009 -- ml grubundan bilerek ayri
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",            # linting + formatting (tek arac, Black+isort+flake8 yerine)
    "mypy>=1.9",             # statik tip kontrolu (Protocol tabanli mimari icin ozellikle degerli)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelpath"]
# Statik dashboard dosyalari icin bkz. ADR 0012.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
# bkz. ARCHITECTURE.md, "Ports & Adapters" bolumu.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
